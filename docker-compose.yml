name: task-manager-api

services:
  api:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://task_api:${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di .env}@db:5432/task_manager
      DIRECT_URL: postgresql://task_api:${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di .env}@db:5432/task_manager
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: task_api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
